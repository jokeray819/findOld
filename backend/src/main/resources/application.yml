spring:
  application:
    name: findold-backend
  datasource:
    url: jdbc:mysql://localhost:3306/findold?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: zjjiang819
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /

# JWT
jwt:
  secret: ${JWT_SECRET:findold-mvp-secret-change-in-production-min-256bits}
  expiration-ms: 604800000

# 微信小程序（占位，MVP 可 mock）
wechat:
  mini:
    app-id: ${WECHAT_APP_ID:}
    secret: ${WECHAT_SECRET:}

# Swagger / OpenAPI（SpringDoc）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
